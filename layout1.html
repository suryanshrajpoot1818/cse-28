<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout1</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #main {
            width: 900px;
            height: 1000px;
            background-color: aqua;
            margin: 0 auto;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        #right {
            flex-grow: 1;
            background-color: red;
        }

        #left {
            flex-grow: 2;
            display: flex;
            flex-direction: column;
            background-color: greenyellow;
            justify-content: space-between;
        }

        header, .content, footer {
            background-color: #999;
            margin: 5px 0;
            width: 100%;
        }

        header, footer {
            height: 300px;
        }

        .content {
            height: 400px;
        }
    </style>
</head>
<body>

<div id="main">
    <div id="left">
        <header><h2>Header</h2></header>
        <div class="content"><h2>Main Content</h2></div>
        <footer><h2>Footer</h2></footer>
    </div>

    <div id="right">
        <h2>Right Box</h2>
    </div>
</div>

</body>
</html>
