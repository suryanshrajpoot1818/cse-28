<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T‑Shirt Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      width: 900px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .product {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    .product img {
      width: 300px;
      border-radius: 8px;
    }

    .details {
      flex: 1;
      min-width: 250px;
    }

    .details h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .price {
      color: #af1824;
      font-size: 22px;
      margin-bottom: 20px;
    }

    button {
      background: #377ddf;
      color: white;
      padding: 12px 20px;
      border: none;
      font-size: 16px;
      border-radius: 6px;
    }

    button:hover {
      background: #2848d8;
    }
  </style>
</head>
<body>
  <header>PUMA MOTORSPORT</header>

  <div class="container">
    <div class="product">
      <img src="https://images.footballfanatics.com/scuderia-ferrari/scuderia-ferrari-race-mt7-t-shirt-by-puma-black_ss5_p-13368638+pv-2+u-1usdpuwgt8yilh4h4fjs+v-7cvdgswpufehzgchv5xx.jpg?_hv=2&w=1018" alt="T-shirt image" />

      <div class="details">
        <h2>Classic Cotton T‑Shirt</h2>
        <p>A soft, comfortable, and stylish T‑shirt perfect for everyday wear.</p>

        <div class="price"> ₹ 9999/-</div>
        <button>Add to Cart</button>
      </div>
    </div>
  </div>
</body>
</html>
